<style>
:root{
  --bg:#F2F6F5;--surface:#fff;--ink:#10272D;--muted:#54696F;--line:#DCE6E5;--line2:#C5D4D3;
  --primary:#0A6A72;--primary-ink:#fff;--deep:#063F46;--sun:#F4A51C;--sun-ink:#10272D;--sun-soft:#FDF0D5;--sun-ink2:#4A3300;
  --teal-soft:#E1F0EF;--danger:#C2412D;--danger-ink:#A3341F;--ok-ink:#166B45;--brand-grad:linear-gradient(135deg,#063F46,#0A6A72);--danger-soft:#FBE9E6;--ok:#1E8E5A;--ok-soft:#E3F4EB;
  --shadow:0 1px 2px rgba(16,39,45,.06),0 6px 18px rgba(16,39,45,.06);
  --r:18px;--nav:68px;
  --f-body:'IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,system-ui,sans-serif;
  --f-head:'Lalezar','IBM Plex Sans Arabic','Noto Sans Arabic',Tahoma,sans-serif;
  color-scheme:light;
}
html.dark{
  --bg:#0A1214;--surface:#121D20;--ink:#E7F0EF;--muted:#9AB0B3;--line:#223437;--line2:#2E4548;
  --primary:#2FB0B9;--primary-ink:#04282B;--deep:#0D2B2F;--sun:#F4A51C;--sun-soft:#34280F;--sun-ink2:#F6D79B;
  --teal-soft:#14302F;--danger:#F0705C;--danger-ink:#F0705C;--ok-ink:#4CC58A;--brand-grad:linear-gradient(135deg,#0A3135,#0E5A61);--danger-soft:#3A1D18;--ok:#4CC58A;--ok-soft:#14301F;
  --shadow:0 1px 0 rgba(255,255,255,.03);color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;overflow-wrap:anywhere;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle}
.ic.s{width:16px;height:16px}.ic.l{width:28px;height:28px}
.ic.fill{fill:currentColor;stroke-width:1.5}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{max-width:520px;margin:0 auto;height:100dvh;position:relative;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media(min-width:560px){#app{border-inline:1px solid var(--line)}}
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);scroll-behavior:auto;position:relative}
#view.nonav{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
.page{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0);opacity:1}100%{transform:translate(var(--dx),420px) rotate(var(--rot));opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* top bars */
.top{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent)}
.top h1{font-family:var(--f-head);font-weight:400;font-size:24px;line-height:1.3;flex:1}
.logo{font-family:var(--f-head);font-size:30px;line-height:1;color:var(--primary);display:flex;align-items:center;gap:8px;flex:1}
.logo i{width:30px;height:30px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:20px;transform:rotate(-6deg)}
.ibtn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;position:relative;color:var(--ink);transition:transform .12s}
.ibtn:active{transform:scale(.92)}
.ibtn .dot{position:absolute;top:6px;inset-inline-end:6px;min-width:18px;height:18px;border-radius:9px;background:#C2412D;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}

.wrap{padding:0 16px}
.gap{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.b{font-weight:700}
.h2{font-family:var(--f-head);font-size:21px;line-height:1.4;font-weight:400}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 16px 8px}
.sec b{font-size:15px}.sec a,.sec button{font-size:13px;font-weight:700;color:var(--primary)}

/* hero */
.hero{margin:4px 16px 0;padding:18px 16px 16px;border-radius:26px;background:var(--brand-grad);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(244,165,28,.18);inset-inline-start:-50px;top:-60px}
.hero h2{font-family:var(--f-head);font-weight:400;font-size:25px;line-height:1.35;position:relative}
.hero p{opacity:.85;font-size:13.5px;position:relative;margin-top:2px}
.search{margin-top:12px;display:flex;align-items:center;gap:8px;height:48px;background:#fff;border-radius:16px;padding:0 14px;color:#10272D;position:relative}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%;color:#10272D}
.search input::placeholder{color:#6d8186}
.search .ic{color:#6d8186}
.stats{display:flex;gap:8px;margin-top:12px;position:relative;flex-wrap:wrap}
.stats span{background:rgba(255,255,255,.14);border-radius:12px;padding:3px 10px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}

/* segmented + chips */
.seg{display:flex;background:var(--teal-soft);border-radius:16px;padding:4px;margin:14px 16px 0;gap:4px}
.seg button{flex:1;height:40px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 8px rgba(10,106,114,.25)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 14px;border-radius:19px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;color:var(--ink)}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip:active{transform:scale(.95)}
.chip.sm{height:34px;padding:0 12px;font-size:13px}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}

/* tiles by group */
.tile{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none;background:var(--teal-soft);font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif}
.tile.lg{width:58px;height:58px;border-radius:18px;font-size:30px}
.g-health{--c:#C2412D}.g-home{--c:#0A6A72}.g-tech{--c:#3D4FB5}.g-transport{--c:#B07700}.g-learn{--c:#7A3FB0}.g-personal{--c:#B03F7E}.g-food{--c:#B5561B}.g-remote{--c:#1C6FA6}
.tile[class*=g-]{background:color-mix(in srgb,var(--c) 14%,var(--surface))}
html.dark .g-health{--c:#F0705C}html.dark .g-tech{--c:#8A98F0}html.dark .g-learn{--c:#C492F0}html.dark .g-personal{--c:#F08ABF}html.dark .g-remote{--c:#6DB8EC}html.dark .g-home{--c:#2FB0B9}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.jcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);transition:transform .12s;position:relative}
.jcard:active{transform:scale(.985)}
.jtitle{font-weight:700;font-size:15.5px;line-height:1.45}
.jmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.jmeta span{display:inline-flex;align-items:center;gap:3px}
.jfoot{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.price{font-family:var(--f-head);font-size:19px;color:var(--primary);line-height:1.2}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;background:var(--teal-soft);color:var(--primary);white-space:nowrap}
.badge.sun{background:var(--sun-soft);color:var(--sun-ink2)}
.badge.gray{background:var(--line);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok-ink)}
.badge.bad{background:var(--danger-soft);color:var(--danger-ink)}
.badge.solid{background:var(--primary);color:var(--primary-ink)}
/* badge/chip carrying text the user typed («خدمة أخرى», up to 80 chars): wrap inside its box instead of running off-screen */
.badge.ut,.chip.ut{white-space:normal;height:auto;max-width:100%;line-height:1.45}
.badge.ut{min-height:24px;padding:3px 9px}
.chip.ut{min-height:38px;padding:7px 14px;flex:0 1 auto}
.wcard .badge.ut{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

.wcard{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.wcard:active{transform:scale(.985)}
.av{width:56px;height:56px;border-radius:50%;flex:none;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--f-head);font-size:26px;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:96px;height:96px;font-size:44px;border:3px solid var(--sun)}
.av.sm{width:40px;height:40px;font-size:19px}
.av .on{position:absolute;bottom:2px;inset-inline-end:2px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.stars{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:13px}
.stars .ic{color:var(--sun);width:15px;height:15px}

/* buttons */
.btn{height:52px;padding:0 20px;border-radius:16px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,opacity .2s;width:100%}
.btn:active{transform:scale(.97)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:var(--surface);color:var(--primary);border:1.5px solid var(--line2)}
.btn.soft{background:var(--teal-soft);color:var(--primary)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.wa{background:#16833F;color:#fff} /* WhatsApp green dark enough for white text (4.8:1; #1FA855 was 3.1) */
.btn.sm{height:42px;font-size:14px;border-radius:13px;padding:0 12px;width:auto;white-space:nowrap}
.btn[disabled],.btn[aria-busy=true]{opacity:.6;pointer-events:none}
.btn[aria-busy=true]::after{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}
.btns.nw .btn{white-space:nowrap;padding:0 12px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-size:13.5px;font-weight:700}
.inp{height:50px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);padding:0 14px;outline:0;width:100%;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:96px;padding:10px 14px;resize:none;line-height:1.55}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.inp.err{border-color:var(--danger)}
.hint{font-size:12.5px;color:var(--muted)}
.pw{position:relative}.pw .inp{padding-inline-end:48px}
.pw button{position:absolute;inset-inline-end:4px;top:3px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.counter{font-size:12px;color:var(--muted);text-align:end}
.step{height:60px;background:var(--surface);border:1.5px solid var(--line2);border-radius:16px;padding:0 8px;display:flex;align-items:center;justify-content:space-between}
.step button{width:44px;height:44px;border-radius:50%;background:var(--teal-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
.step button:active{transform:scale(.9)}
.step output{font-family:var(--f-head);font-size:30px;color:var(--primary);line-height:1.2}
.toggle{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line2);width:100%;text-align:start}
.toggle .sw{width:46px;height:28px;border-radius:14px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle.on .sw{background:var(--primary)}
.toggle.on .sw::after{transform:translateX(-18px)}
.opt{display:flex;align-items:center;gap:6px;padding:10px 8px;white-space:nowrap;min-width:0;border-radius:16px;border:2px solid var(--line);background:var(--surface);flex:1;font-weight:600;font-size:14px;justify-content:center;transition:all .15s;min-height:58px}
.opt.on{border-color:var(--primary);background:var(--teal-soft)}
.opt .ic{color:var(--primary)}

/* bottom nav */
.nav{position:absolute;bottom:0;inset-inline:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;transition:color .15s}
.nav a.on{color:var(--primary)}
.nav a.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.nav a .bd{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:#C2412D;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.nav .plus{transform:translateY(-14px)}
.nav .plus span{width:54px;height:54px;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(244,165,28,.45);transition:transform .15s}
.nav .plus:active span{transform:scale(.9)}
.nav .plus em{font-style:normal;margin-top:-2px}

/* sheet / toast */
.scrim{position:fixed;inset:0;background:rgba(6,20,22,.5);z-index:60;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;bottom:0;inset-inline:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;z-index:61;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:88dvh;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.sheet h3{font-family:var(--f-head);font-weight:400;font-size:22px;margin-bottom:6px}
.toast{position:fixed;bottom:calc(var(--nav) + 18px + env(safe-area-inset-bottom));inset-inline:16px;max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;z-index:80;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;animation:rise .2s both;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.toast.bad{background:var(--danger);color:#fff}
.toast.ok{background:var(--ok-ink);color:#fff}
html.dark .toast.bad,html.dark .toast.ok{color:#10272D}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--sun-soft);color:var(--sun-ink2);font-size:13.5px;line-height:1.55}
.banner.teal{background:var(--teal-soft);color:var(--primary)}
.banner.bad{background:var(--danger-soft);color:var(--danger-ink)} /* --danger on --danger-soft was 4.38:1 in light mode */
.banner.ok{background:var(--ok-soft);color:var(--ok-ink)}
.banner .ic{margin-top:2px}
.offline{background:var(--ink);color:var(--bg);font-size:12.5px;text-align:center;padding:4px;font-weight:600}

/* skeleton */

let sheetEl = null, scrimEl = null, sheetClose = null;
function openSheet(html, onMount) {
  closeSheet(true);
  scrimEl = document.createElement('div'); scrimEl.className = 'scrim';
  sheetEl = document.createElement('div'); sheetEl.className = 'sheet'; sheetEl.setAttribute('role', 'dialog'); sheetEl.setAttribute('aria-modal', 'true');
  sheetEl.innerHTML = '<div class="grab"></div>' + html;
  document.body.append(scrimEl, sheetEl);
  scrimEl.onclick = () => closeSheet();
  const s = sheetEl, c = scrimEl; /* the sheet may already be closed (globals null) by the next frame, e.g. a page change */
  requestAnimationFrame(() => { c.classList.add('show'); s.classList.add('show'); });
  if (onMount) onMount(sheetEl);
  return sheetEl;
}
function closeSheet(instant) {
  const s = sheetEl, c = scrimEl; sheetEl = scrimEl = null;
  if (sheetClose) { const f = sheetClose; sheetClose = null; f(false); }
  if (!s) return;
  if (instant) { s.remove(); c.remove(); return; }
  s.classList.remove('show'); c.classList.remove('show');
  setTimeout(() => { s.remove(); c.remove(); }, 260);
}

/* ====== router ====== */
let NAVDEPTH = 0;
const STACK = [];
const ROUTES = [];
const SCROLL = {};
let renderTok = 0, curHash = '';
function route(re, fn, opts) { ROUTES.push({ re, fn, opts: opts || {} }); }
function go(path) { location.hash = '#' + path; }
function replace(path) { try { location.replace(location.href.split('#')[0] + '#' + path); } catch (e) { location.hash = '#' + path; } }
function loginTo(next, tab) { replace('/login?' + (tab ? 'tab=' + tab + '&' : '') + 'next=' + encodeURIComponent(next || (location.hash.slice(1) || '/'))); }

function paint(res, tok) {
  if (tok !== renderTok) return;
  const v = $('#view');
  v.className = res.nonav ? 'nonav' : '';
  v.innerHTML = `<div class="page">${res.html}</div>`;
  const nav = $('#nav');
  nav.hidden = !!res.nonav;
  if (!res.nonav) { nav.dataset.active = res.nav || ''; nav.innerHTML = navHtml(res.nav || ''); }
  updateBadges();
  if (res.mount) { try { res.mount(v); } catch (e) { console.error(e); } }
}

async function render() {
  const tok = ++renderTok;
  const raw = (location.hash || '#/').slice(1) || '/';
  /* Facebook glues «&fbclid=…» onto the end of a shared link, after the # (#/join&fbclid=…): a bare & starts the query too */
  const qi = raw.search(/[?&]/);
  const path = qi < 0 ? raw : raw.slice(0, qi);
  const q = Object.fromEntries(new URLSearchParams(qi < 0 ? '' : raw.slice(qi + 1)));
  const v = $('#view');
  if (curHash) SCROLL[curHash] = v.scrollTop;
  // stack for back detection
  if (STACK.length > 1 && STACK[STACK.length - 2] === raw) { STACK.pop(); NAVDEPTH = Math.max(0, NAVDEPTH - 1); }
  else if (STACK[STACK.length - 1] !== raw) { STACK.push(raw); NAVDEPTH = STACK.length - 1; }
  const wasBack = SCROLL[raw] != null && STACK[STACK.length - 1] === raw && NAVDEPTH >= 0;
  curHash = raw;
  closeSheet(true);
  for (const r of ROUTES) {
    const m = path.match(r.re);
    if (!m) continue;
    if (r.opts.auth && !S.token) { loginTo(raw, r.opts.guestTab); return; }

(function () {

  document.addEventListener('touchstart', e => {

  const q = LS.get('srcq', null), me = S.me;

    const now = LS.get('srcq', null);
    if (r && r.ok && now && now.u === q.u && now.at === q.at) LS.del('srcq');
  } catch (e) {}
}

function bindOtp(root) {
  const ins = $$('.otp input', root);
  ins.forEach((el, i) => {
    el.addEventListener('input', () => {
      el.value = el.value.replace(/\D/g, '').slice(-1);
      if (el.value && ins[i + 1]) ins[i + 1].focus();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Backspace' && !el.value && ins[i - 1]) ins[i - 1].focus(); });
    el.addEventListener('paste', e => {
      const d = enDigits(e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 4);
      if (d.length > 1) { e.preventDefault(); ins.forEach((x, k) => x.value = d[k] || ''); ins[Math.min(d.length, 3)].focus(); }
    });
  });
}

function jobRole(j) {

  if (j.status !== 'hidden') return '';

function hiddenWhy(j, adm) {
  const when = j.hiddenAt ? ` <span class="xs">(${ago(j.hiddenAt)})</span>` : '';
  if (j.hiddenReason) return (adm ? 'الطلب مخفي. ' : 'انخفى طلبك من الإدارة. ') + `<b>السبب:</b> ${esc(j.hiddenReason)}` + (adm && j.hiddenBy ? ' · ' + esc(j.hiddenBy) : '') + when;

/* ====== image helpers ====== */
async function loadImg(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) {} }
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; im.src = u;
  });
}
function jpeg(img, sx, sy, sw, sh, w, h, q, maxLen) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.imageSmoothingQuality = 'high';
  x.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  let out = c.toDataURL('image/jpeg', q);
  while (out.length > maxLen && q > 0.3) { q -= 0.08; out = c.toDataURL('image/jpeg', q); }
  return out;
}
async function makeAvatar(file) {
  const img = await loadImg(file), W = img.width || img.naturalWidth, H = img.height || img.naturalHeight;
  const side = Math.min(W, H), sx = (W - side) / 2, sy = (H - side) / 2;
  return { avatar: jpeg(img, sx, sy, side, side, 320, 320, .76, 110000), thumb: jpeg(img, sx, sy, side, side, 96, 96, .7, 15000) };
}
async function makeWork(file) {
  const img = await loadImg(file), W = img.width || img.naturalWidth, H = img.height || img.naturalHeight, k = Math.min(1, 800 / Math.max(W, H));
  return jpeg(img, 0, 0, W, H, Math.round(W * k), Math.round(H * k), .72, 230000);
}
function pickFile(multi) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (multi) i.multiple = true;
    i.style.display = 'none'; document.body.appendChild(i);
    i.onchange = () => { const f = Array.from(i.files || []); i.remove(); res(f); };
    i.addEventListener('cancel', () => { i.remove(); res([]); });
    i.click();
  });
}

/* ====== admin ====== */
let AD = { tab: 'pending', wst: 'approved', jst: '', jq: '', jseq: 0, cache: {} };
const AD_TABS = [['pending', 'المراجعة'], ['jobs', 'الطلبات'], ['reports', 'البلاغات'], ['workers', 'العمّال'], ['services', 'الخدمات'], ['overview', 'نظرة عامة']];
route(/^\/admin$/, async ctx => {
  if (!S.me || !S.me.admin) { await refreshMe(); if (!S.me || !S.me.admin) { toast('هذه الصفحة للإدارة فقط', 'bad'); replace('/account'); return null; } }
  if (AD_TABS.some(t => t[0] === ctx.q.tab)) AD.tab = ctx.q.tab; /* notifications link straight to a tab (?tab=pending) */
  const bar = () => `<div class="chips" style="padding-top:4px;flex-wrap:wrap;overflow:visible">${AD_TABS.map(t => `<button class="chip ${AD.tab === t[0] ? 'on' : ''}" data-a="adtab" data-v="${t[0]}">${t[1]}${t[0] === 'pending' && AD.cache.pending ? ` <span class="badge solid">${AD.cache.pending}</span>` : ''}</button>`).join('')}</div>`;
  ctx.paint({ html: topbar('لوحة الإدارة') + bar() + skeletons(3, 'w'), nav: 'account' });
  let body = '';
  if (AD.tab === 'overview') body = await adOverview();
  else if (AD.tab === 'pending') body = await adPending();
  else if (AD.tab === 'jobs') body = await adJobs();
  else if (AD.tab === 'reports') body = await adReports();
  else if (AD.tab === 'services') body = await adServices();
  else body = await adWorkers();
  return { html: topbar('لوحة الإدارة') + bar() + body, nav: 'account', mount: v => { if (AD.tab === 'jobs') adJobsMount(v); } };
}, { auth: true });
/* switching tabs repaints at once, as it did before the tab went into the link. replaceState keeps ?tab= right
   without a «hashchange»: changing location.hash re-rendered only on that later event, so for a moment the old tab
   stayed on screen after the click (the «no .ut element» test caught it). Sandboxed previews without replaceState
   fall back to the link. */
ACT.adtab = t => {
  AD.tab = t.dataset.v;
  try { history.replaceState(history.state, '', '#/admin?tab=' + AD.tab); } catch (e) { return replace('/admin?tab=' + AD.tab); }
  render();
};

function adJobCard(j) {

  return `<div class="card gap" data-j="${esc(j.id)}"><a class="row" href="#/job/${esc(j.id)}" style="align-items:flex-start">${tileHtml(j.service)}<div class="sp"><div class="jtitle">${esc(j.title)}</div>

    <div class="row" style="flex-wrap:wrap;gap:6px">${flags.join('')}</div>

}
function adJobsMount(v) {
  const q = $('#adj-q', v); if (!q) return;
  q.addEventListener('input', debounce(async () => {
    AD.jq = q.value.trim(); const k = ++AD.jseq;
    let h; try { h = await adJobsList(); } catch (e) { h = errorBox(e, 'adjload'); }
    const box = $('#adj-list'); if (box && k === AD.jseq) box.innerHTML = h;
  }, 400));
  q.addEventListener('keydown', e => { if (e.key === 'Enter') q.blur(); });
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && curHash === '/account') pushRowPaint(); });
ACT.pushon = t => busy(t, pushEnable);
ACT.pushoff = async () => {
  if (!await confirmSheet({ title: 'تطفي إشعارات الجوال؟', text: 'ما رح يوصلك إشعار على هالجوال لحد ما ترجع تفعّلها. إشعارات التطبيق (الجرس) بتضل زي ما هي.', ok: 'إطفاء', danger: true })) return;
  await pushOff(); toast('انطفت الإشعارات على هالجوال'); pushRowPaint();
};
ACT.pushhelp = () => pushHelp();
/* blocked / iPhone / Facebook browser: what to do, instead of a button that can't work */
function pushHelp() {
  const m = pushMode(), k = pwaK;
  let title, text, steps;
  if (m === 'denied') {
    title = 'الإشعارات محظورة 🔕'; text = 'انحظرت من إعدادات المتصفح، فما بنقدر نبعتلك إشعارات. لترجّعها:';
    steps = PWA.ios() ? ['افتح «الإعدادات» بالآيفون، وبعدين «الإشعارات»', 'اختار «شغلة» وشغّل «السماح بالإشعارات»', 'ارجع لشغلة واضغط «فعّل الإشعارات»']
      : pwaStandalone() ? ['اضغط مطوّل على أيقونة شغلة بشاشة الجوال، واختار «معلومات التطبيق»', 'افتح «الإشعارات» وشغّلها', 'ارجع لشغلة واضغط «فعّل الإشعارات»']
      : [`اضغط على الإشارة اللي جنب رابط الموقع فوق ${k(ic('lock', 's'))}`, 'افتح «الأذونات» أو «إعدادات الموقع»، وخلّي «الإشعارات» على «السماح»', 'ارجع هون واضغط «فعّل الإشعارات»'];
  } else if (m === 'ios') {
    title = 'الإشعارات على الآيفون 🔔'; text = 'على الآيفون، إشعارات شغلة بتشتغل بس لما تكون مثبّتة على الشاشة الرئيسية (iOS 16.4 أو أحدث). ثبّتها هيك:';
    steps = pwaSteps('ios').concat('افتح شغلة من أيقونتها، ومن «حسابي» فعّل الإشعارات');
  } else if (m === 'inapp') {
    title = 'افتح شغلة بالمتصفح 🔔'; text = 'إنت فاتح شغلة من جوّا فيسبوك أو إنستغرام، والإشعارات ما بتشتغل هون.';
    steps = pwaSteps('inapp').slice(0, 2).concat('ادخل بحسابك، ومن «حسابي» فعّل الإشعارات');
  } else return;
  openSheet(`<h3>${title}</h3><p class="muted sm" style="margin-bottom:12px">${text}</p>
    <ol class="pwa-steps" id="push-steps">${steps.map(s => `<li><span>${s}</span></li>`).join('')}</ol><button class="btn" data-a="sheetx">تمام</button>`);
}

/* ---- on / off ---- */
/* the browser's question must come straight from the tap (iPhone is strict): first thing, before any wait */
function pushPermission() {
  const N = window.Notification;
  if (N.permission === 'granted') return Promise.resolve('granted');
  return new Promise(res => {
    let p; try { p = N.requestPermission(r => res(r)); } catch (e) { return res(N.permission); }
    if (p && p.then) p.then(res, () => res(N.permission));
  });
}
/* the browser's subscription for our key: the one it has, or a new one (also after a key change) */
async function pushSubscribe() {
  const reg = await PUSH.reg(true), key = pushKey();
  if (!reg || !reg.pushManager || !key) throw new Error('no_sw');
  let sub = await reg.pushManager.getSubscription();
  const k = sub && sub.options && sub.options.applicationServerKey, a = k ? new Uint8Array(k) : null;
  if (a && !(a.length === key.length && a.every((v, i) => v === key[i]))) { await sub.unsubscribe().catch(() => {}); sub = null; }
  return sub || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
}
async function pushEnable() {
  if (pushMode() !== 'ready') { pushHelp(); return false; }
  const me = S.me, perm = await pushPermission();
  if (S.me !== me) return false;
  if (perm !== 'granted') {
    toast(perm === 'denied' ? 'انحظرت الإشعارات. إذا غيّرت رأيك، بترجّعها من إعدادات المتصفح' : 'ما انفعّلت الإشعارات. بتقدر تفعّلها من «حسابي» وقت ما بدك');
    pushRowPaint(); return false;
  }
  try {
    const sub = await pushSubscribe();
    await rpc('push_subscribe', { p_sub: sub.toJSON() });
    if (S.me !== me) return false;
    LS.set('push', { u: me.id, e: sub.endpoint, at: Date.now() });
    toast('تمام، الإشعارات صارت مفعّلة على هالجوال', 'ok'); buzz(15);
    pushRowPaint(); return true;
  } catch (e) {
    toast(e && typeof e.code === 'string' ? errMsg(e) : PUSH_FAIL, 'bad'); /* the browser's own errors say nothing useful */
    pushRowPaint(); return false;
  }
}
/* the browser forgets it: then nothing reaches this phone, even if the server still has it */
function pushDrop() {
  if (!PWA.sw) return Promise.resolve();
  return PUSH.reg(false).then(r => r && r.pushManager ? r.pushManager.getSubscription() : null).then(s => s && s.unsubscribe()).catch(() => {});
}
/* «إطفاء»: the server first (while the token works), then the browser */
async function pushOff() {
  LS.del('push');
  if (!PWA.sw) return;
  const reg = await PUSH.reg(false), sub = reg && reg.pushManager ? await reg.pushManager.getSubscription().catch(() => null) : null;
  if (!sub) return;
  if (S.token) await rpc('push_unsubscribe', { p_endpoint: sub.endpoint }, { timeout: 6000 }).catch(() => {});
  await sub.unsubscribe().catch(() => {});
}
/* logout: the server, then the browser. Remembered as wanted ({u, e: null}): back by itself when the same person logs
   in again, never for anyone else. A session that ends without a logout: the server stops at once (each subscription
   is tied to its session), the phone keeps it, and logging in again re-links it (pushSync) */
async function pushLogout() {
  if (!PWA.sw || !S.token) return;
  const f = LS.get('push', null);
  if (f && f.e) LS.set('push', { u: f.u, e: null, at: 0 });
  const reg = await PUSH.reg(false), sub = reg && reg.pushManager ? await reg.pushManager.getSubscription().catch(() => null) : null;
  if (!sub) return;
  await rpc('push_unsubscribe', { p_endpoint: sub.endpoint }, { timeout: 6000 }).catch(() => {});
  await sub.unsubscribe().catch(() => {});
}
/* phone and server in step: at every open (a changed subscription or key) and after logging in (login: told again,
   so it belongs to the new session) */
async function pushSync(login) {
  const f = LS.get('push', null), me = S.me;
  if (!f || !me || !S.token) return;
  if (f.u !== me.id) { LS.del('push'); return pushDrop(); } /* someone else's */
  const m = pushMode();
  if (m !== 'ready' && m !== 'denied') return;
  if (Notification.permission !== 'granted') { LS.del('push'); return; } /* blocked or reset in the settings */
  if (!f.e && !login) return;
  try {
    const sub = await pushSubscribe();
    if (S.me !== me) return;
    if (!login && sub.endpoint === f.e && Date.now() - (f.at || 0) < PUSH_RESEND) return; /* in step: no call */
    await rpc('push_subscribe', { p_sub: sub.toJSON() });
    if (f.e && f.e !== sub.endpoint) rpc('push_unsubscribe', { p_endpoint: f.e }).catch(() => {});
    if (S.me === me) { LS.set('push', { u: me.id, e: sub.endpoint, at: Date.now() }); pushRowPaint(); }
  } catch (e) {}
}
window.addEventListener('load', () => setTimeout(() => pushSync(false), 2500));

/* ---- asked once, at the right moment: after publishing a job ('job') / after the join request ('join').
   Per person and kind, remembered when the sheet closes (however it closes), not when it opens ---- */
function pushCanAsk(kind) { return !!S.me && pushMode() === 'ready' && !pushIsOn() && !LS.get('pask_' + kind + '_' + S.me.id, false); }
function pushAsk(kind) {
  const k = 'pask_' + kind + '_' + S.me.id, job = kind === 'job';
  openSheet(`<h3 id="push-ask">${job ? 'بدك نبعتلك إشعار أول ما يوصلك عرض؟' : 'بدك إشعار لما ينزل طلب بخدمتك؟'}</h3>
    <p class="muted sm" style="margin-bottom:14px">${job ? '' : 'وكمان لما نراجع طلب انضمامك. '}بيوصلك على الجوال حتى لو شغلة مسكّرة، لما يكون عندك نت. وبتقدر تطفيه من «حسابي» وقت ما بدك.</p>
    <div class="btns"><button class="btn sun" data-a="pushyes">اه، فعّلها</button><button class="btn ghost" data-a="sheetx">مش هلأ</button></div>`);
  sheetClose = () => LS.set(k, Date.now());
}
ACT.pushyes = () => { pushEnable(); closeSheet(); }; /* pushEnable first: the browser's question needs this tap */
/* a tapped notification while شغلة is open: the service worker asks this page to open the link (a hash change, no
   reload) and waits for this answer; a page too old to answer is moved by the service worker itself */
if (PWA.sw) navigator.serviceWorker.addEventListener('message', e => {
  const d = e.data || {};
  if (d.shughla !== 'open' || typeof d.url !== 'string' || !/^#\/[^\s<>"'\\]{0,200}$/.test(d.url)) return;
  if (e.ports && e.ports[0]) e.ports[0].postMessage(1);
  if (location.hash === d.url) render(); else location.hash = d.url;
});

</script>
